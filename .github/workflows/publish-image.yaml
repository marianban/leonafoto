name: Publish Docker image
run-name: Publish leonafoto:0.0.${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: 0.0.${{ github.run_number }}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare image tag and validate configuration
        id: image
        shell: bash
        run: |
          if [[ -z "$NEXT_PUBLIC_RECAPTCHA_SITE_KEY" ]]; then
            echo '::error::Set the repository Actions variable NEXT_PUBLIC_RECAPTCHA_SITE_KEY before publishing.'
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/leonafoto"
          echo "tag=${image}:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ env.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=leonafoto
          cache-to: type=gha,mode=max,scope=leonafoto

      - name: Report published image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: printf 'Published `%s`\n' "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
